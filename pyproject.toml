[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aevum-sim"
version = "0.2.0"
description = "A persistent autonomous-world simulation governed by Axiom."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Sterling Thomas" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
